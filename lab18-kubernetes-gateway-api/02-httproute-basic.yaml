# ============================================================
# Lab 18 — Gateway API: Step 2 — HTTPRoute
# Path-based routing
# ============================================================
# Requests:
#   /api/*  -> api-service:8080
#   /web/*  -> frontend-svc:80
# ============================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-service
  namespace: gateway-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-service
  template:
    metadata:
      labels:
        app: api-service
    spec:
      containers:
        - name: api
          image: hashicorp/http-echo:latest
          args:
            - "-text=Hello from the API backend"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
          resources:
            limits:
              cpu: "100m"
              memory: "64Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: gateway-lab
spec:
  selector:
    app: api-service
  ports:
    - port: 8080
      targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: gateway-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: hashicorp/http-echo:latest
          args:
            - "-text=Hello from the Frontend"
            - "-listen=:80"
          ports:
            - containerPort: 80
          resources:
            limits:
              cpu: "100m"
              memory: "64Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: gateway-lab
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: path-based-route
  namespace: gateway-lab
spec:
  parentRefs:
    - name: shared-gateway
      namespace: gateway-lab
      sectionName: http

  hostnames:
    - "lab.example.com"

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: api-service
          port: 8080
          weight: 1

    - matches:
        - path:
            type: PathPrefix
            value: /web
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: frontend-svc
          port: 80
          weight: 1
