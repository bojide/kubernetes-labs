apiVersion: v1
kind: Pod
metadata:
  name: writer-pod
  namespace: storage-lab
  labels:
    lab: "20-storage"
    role: writer
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "Written by writer-pod at $(date -u '+%Y-%m-%dT%H:%M:%SZ')" > /data/message.txt
          echo "Hostname: $(hostname)" >> /data/message.txt
          cat /data/message.txt
          sleep 3600
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
      volumeMounts:
        - name: persistent-data
          mountPath: /data
  volumes:
    - name: persistent-data
      persistentVolumeClaim:
        claimName: app-data-pvc
