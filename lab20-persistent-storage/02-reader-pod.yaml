apiVersion: v1
kind: Pod
metadata:
  name: reader-pod
  namespace: storage-lab
  labels:
    lab: "20-storage"
    role: reader
spec:
  restartPolicy: Never
  containers:
    - name: reader
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          echo "Files in /data:"
          ls -la /data
          echo "Reading the writer's message:"
          cat /data/message.txt
          sleep 3600
      resources:
        requests:
          cpu: "50m"
          memory: "32Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
      volumeMounts:
        - name: persistent-data
          mountPath: /data
  volumes:
    - name: persistent-data
      persistentVolumeClaim:
        claimName: app-data-pvc
