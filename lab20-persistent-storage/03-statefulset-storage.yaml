apiVersion: v1
kind: Service
metadata:
  name: db-store-headless
  namespace: storage-lab
  labels:
    lab: "20-storage"
spec:
  clusterIP: None
  selector:
    app: db-store
  ports:
    - name: app
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db-store
  namespace: storage-lab
  labels:
    lab: "20-storage"
spec:
  serviceName: db-store-headless
  replicas: 3
  selector:
    matchLabels:
      app: db-store
  template:
    metadata:
      labels:
        app: db-store
    spec:
      containers:
        - name: store
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              if [ ! -f /data/pod-identity.txt ]; then
                echo "Pod $(hostname) first started at $(date -u '+%Y-%m-%dT%H:%M:%SZ')" > /data/pod-identity.txt
              fi
              cat /data/pod-identity.txt
              sleep 3600
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          lab: "20-storage"
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
