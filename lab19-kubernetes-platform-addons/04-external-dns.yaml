apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: external-dns

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
  - apiGroups: [""]
    resources: ["services", "pods", "nodes"]
    verbs: ["get", "watch", "list"]

  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "watch", "list"]

  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes"]
    verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: external-dns

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
spec:
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: external-dns

  template:
    metadata:
      labels:
        app: external-dns

    spec:
      serviceAccountName: external-dns

      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.20.0

          args:
            - --source=gateway-httproute
            - --provider=aws
            - --domain-filter=babajideajisafe.com
            - --zone-id-filter=Z0929933S7BZIF3A7R74
            - --aws-zone-type=public
            - --registry=txt
            - --txt-owner-id=jide-k3s-lab
            - --policy=upsert-only
            - --dry-run
            - --log-level=info

          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: route53-credentials-secret
                  key: access-key-id

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: route53-credentials-secret
                  key: secret-access-key
