apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: lab-tls-cert
  namespace: gateway-lab
spec:
  secretName: shared-gateway-tls

  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
    group: cert-manager.io

  dnsNames:
    - lab.babajideajisafe.com
    - api.babajideajisafe.com

  commonName: lab.babajideajisafe.com

  duration: 2160h
  renewBefore: 720h

  privateKey:
    algorithm: RSA
    size: 2048

  usages:
    - digital signature
    - key encipherment
    - server auth
