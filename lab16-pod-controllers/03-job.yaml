# ============================================================
# Lab 16 — Pod Controllers
# File 03: Job
# ============================================================

apiVersion: batch/v1
kind: Job
metadata:
  name: batch-processor
  namespace: controllers-lab
  labels:
    lab: "16-pod-controllers"

spec:
  completions: 5
  parallelism: 2
  backoffLimit: 3
  ttlSecondsAfterFinished: 600

  template:
    metadata:
      labels:
        app: batch-processor
        job-type: lab-demo

    spec:
      restartPolicy: Never

      containers:
        - name: worker
          image: busybox:1.36

          command:
            - sh
            - -c

          args:
            - |
              echo "Job worker starting."
              echo "Hostname: $(hostname)"
              echo "Simulating work for 5 seconds..."
              sleep 5
              echo "Work complete. Exiting successfully."

          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
