# ============================================================
# Lab 16 — Pod Controllers
# File 02: StatefulSet + Headless Service
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: db-headless
  namespace: controllers-lab
  labels:
    lab: "16-pod-controllers"

spec:
  clusterIP: None

  selector:
    app: db

  ports:
    - name: db
      port: 5432
      targetPort: 5432

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  namespace: controllers-lab
  labels:
    lab: "16-pod-controllers"

spec:
  serviceName: "db-headless"

  replicas: 3

  selector:
    matchLabels:
      app: db

  updateStrategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: db

    spec:
      terminationGracePeriodSeconds: 10

      containers:
        - name: db
          image: busybox:1.36

          command:
            - sh
            - -c
            - 'while true; do echo "I am $(hostname)"; sleep 5; done'

          ports:
            - containerPort: 5432
              name: db

          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"

          volumeMounts:
            - name: data
              mountPath: /data

      volumes:
        - name: data
          emptyDir: {}
